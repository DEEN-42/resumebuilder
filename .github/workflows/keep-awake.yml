name: Keep Services Awake

on:
  schedule:
    # Runs every 7 minutes to prevent Render's 15-minute sleep timer
    - cron: '*/7 * * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Ping Node.js Backend
        run: curl --silent --show-error --fail "${{ secrets.BACKEND_HEALTH_URL }}"

      - name: 🌐 Ping AI Service
        run: curl --silent --show-error --fail "${{ secrets.AI_SERVICE_HEALTH_URL }}"