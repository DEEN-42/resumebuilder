##############################################################################
# CI/CD Pipeline — Resume Builder Monorepo
#
# JOBS OVERVIEW
# ─────────────────────────────────────────────────────────────────────────────
#   test-frontend  ──┐
#                    ├── (both must pass) ──▶  deploy-backend  ──▶  deploy-frontend
#   test-backend   ──┘
#
# TRIGGERS
#   • test-frontend + test-backend → every push and every pull_request
#   • deploy-* → push to main branch ONLY when commit starts with 'deploy:'
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions)
#   RENDER_DEPLOY_HOOK_URL  — Deploy Hook URL from Render service settings
#   VERCEL_TOKEN            — Personal Access Token from vercel.com/account/tokens
#   VERCEL_ORG_ID           — Team/personal scope ID (vercel teams ls or vercel.json)
#   VERCEL_PROJECT_ID       — Project ID from Vercel project settings
##############################################################################

name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'          # Run tests on every branch push
  pull_request:
    branches:
      - '**'          # Run tests on every PR

# Cancel in-progress runs on the same branch when a newer push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Frontend Tests (Vitest)
  # ────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      # vitest run exits cleanly after tests — no --watch mode in CI
      - name: ✅ Run Vitest tests
        run: npm test

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Backend Tests (Jest + supertest)
  # ────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Backend Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      # --forceExit ensures Jest doesn't hang due to open async handles
      - name: ✅ Run Jest tests
        run: npm test
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          NODE_ENV: test

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: AI Service Tests (pytest)
  # ────────────────────────────────────────────────────────────────────────────
  test-ai-service:
    name: 🧪 AI Service Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: microservices/ai-service

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: microservices/ai-service/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt pytest httpx pytest-asyncio

      - name: ✅ Run Pytest tests
        run: pytest test_app.py
        env:
          GROQ_API_KEY: "dummy_key_for_tests"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy Backend to Render
  # Condition: ONLY on push to main WITH commit starting with 'deploy:'
  # Depends on: all tests passing
  # ────────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy Backend → Render
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-ai-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'deploy:')

    steps:
      - name: 🔔 Trigger Render Deploy Hook
        run: |
          RESPONSE=$(curl --silent --show-error --fail \
            --max-time 30 \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render API response: $RESPONSE"

      - name: ℹ️ Deploy triggered
        run: |
          echo "Backend deploy triggered on Render."
          echo "Monitor deploy status at: https://dashboard.render.com"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Deploy AI Service to Render
  # Condition: ONLY on push to main WITH commit starting with 'deploy:'
  # Depends on: all tests passing
  # ────────────────────────────────────────────────────────────────────────────
  deploy-ai-service:
    name: 🚀 Deploy AI Service → Render
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend, test-ai-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'deploy:')

    steps:
      - name: 🔔 Trigger Render Deploy Hook
        run: |
          RESPONSE=$(curl --silent --show-error --fail \
            --max-time 30 \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL_AI }}")
          echo "Render API response: $RESPONSE"

      - name: ℹ️ Deploy triggered
        run: |
          echo "AI Service deploy triggered on Render."
          echo "Monitor deploy status at: https://dashboard.render.com"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 6: Deploy Frontend to Vercel
  # Condition: ONLY on push to main WITH commit starting with 'deploy:'
  # Depends on: backend and ai-service deployments completing successfully
  # ────────────────────────────────────────────────────────────────────────────
  deploy-frontend:
    name: 🚀 Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-ai-service]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && startsWith(github.event.head_commit.message, 'deploy:')

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: 🌐 Install Vercel CLI
        run: npm install --global vercel@latest

      - name: 📥 Pull Vercel project settings
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 🏗️ Build for production
        run: |
          vercel build \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: 📤 Deploy to Vercel (production)
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}